<!doctype html>
<meta charset="utf-8">
<title>Webs Browser</title>
<!--
  The browser chrome. This page IS the tab strip, omnibox, menus, find bar,
  Shield, VPN and media panels, the sidebar's icon rail and the download list;
  the C# shell only draws a window around it and runs the WebView2 instances.

  Two rules keep the seam clean:
    1. Every pixel of UI is here. The shell never draws chrome.
    2. Every byte of user data is here, in localStorage. The shell never stores it
       (except machine state: window position, filter-list cache, VPN password).

  The shell resizes this page's host to whatever height we report, and clips it
  to the toolbar plus whatever is open (a panel, the sidebar rail) - so panels
  float over the page without covering it, and clicks beside them reach the page.
-->
<style>
:root{
  --bg:#16131a; --bg2:#1e1a24; --bg3:#272230; --bg4:#322c3c;
  --line:#322c3c; --fg:#f3eff1; --dim:#9a91a3; --dim2:#6f6779;
  --accent:#e8342a; --accent-fg:#fff; --soft:rgba(232,52,42,.15); --good:#4ec98a; --warn:#e8a33a;
  --shadow:0 12px 32px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
  --r:9px; --strip:38px; --bar:46px;
}
:root[data-theme="light"]{
  --bg:#e9e5de; --bg2:#f7f3ea; --bg3:#e4ded4; --bg4:#d8d1c5;
  --line:#d6cfc3; --fg:#1d1a20; --dim:#6b6560; --dim2:#928b83;
  --soft:rgba(232,52,42,.13); --good:#1f9a5c; --warn:#b8741a;
  --shadow:0 12px 32px rgba(60,50,40,.22), 0 2px 6px rgba(60,50,40,.14);
}
body.compact{--strip:32px;--bar:38px}
body.tiny{--strip:28px;--bar:32px;font-size:12px}
body.tiny .btn{width:24px;height:24px}
body.tiny .btn svg{width:15px;height:15px}
.grade{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font:700 20px "Segoe UI",system-ui,sans-serif;color:#fff;flex:none}
.grade.gA{background:#2e9d5b}.grade.gB{background:#6aa84f}.grade.gC{background:#d6a21e}.grade.gD{background:#e07b2a}.grade.gF{background:#d63a2f}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center}
#lock .box{text-align:center;animation:toastIn .3s}
#lock input{height:38px;width:160px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);text-align:center;font:inherit;letter-spacing:.2em;outline:0;margin:12px 0}
#lock input.bad{border-color:var(--accent)}
#scratch{right:8px;width:420px;padding:10px}
#scratch textarea{width:100%;height:320px;resize:vertical;border-radius:9px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);padding:10px;font:13px/1.5 "Cascadia Mono",Consolas,monospace;outline:0}
#scratch .hd{display:flex;align-items:center}
.ttools{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 14px}
.ttools button{padding:7px 8px;border-radius:7px;background:var(--bg3);color:var(--fg);font-size:12.5px;text-align:left}
.ttools button:hover{background:var(--bg4)}
.achv{display:flex;align-items:center;gap:10px;padding:8px 14px}
.achv b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg3);font-size:15px;flex:none}
.achv.got b{background:linear-gradient(135deg,#f5c542,#e8342a);box-shadow:0 0 12px rgba(245,197,66,.5)}
.achv span{flex:1;font-size:12.5px}.achv em{font-style:normal;color:var(--dim2);font-size:11px;display:block}
.achv:not(.got){opacity:.55}
.userhide{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:transparent;color:var(--fg);
  font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
svg{display:block;pointer-events:none}
.ic{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;
    stroke-linecap:round;stroke-linejoin:round}
body.fs #chrome{display:none}

/* ---------------------------------------------------------------- tab strip */
#chrome{background:var(--bg)}
#strip{display:flex;align-items:flex-end;height:var(--strip);padding:0 6px;gap:2px}
#tabs{display:flex;align-items:flex-end;flex:0 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:7px;height:calc(var(--strip) - 6px);
  min-width:96px;max-width:212px;flex:1 1 212px;padding:0 8px 0 10px;
  border-radius:var(--r) var(--r) 4px 4px;color:var(--dim);
  transition:background .12s,color .12s}
.tab:hover{background:var(--bg3);color:var(--fg)}
.tab.on{background:var(--bg2);color:var(--fg)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;
  background:var(--accent);border-radius:2px 2px 0 0}
.tab.pair{background:var(--bg2);color:var(--fg)}
.tab.pair::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;
  background:var(--dim2);border-radius:2px 2px 0 0}
.tab.pin{flex:none;min-width:40px;width:40px;padding:0;justify-content:center}
.tab.pin .ttl,.tab.pin .x{display:none}
.tab.pin::after{left:8px;right:8px}
.tab[data-color]::before{content:"";position:absolute;left:6px;right:6px;top:3px;height:3px;border-radius:2px;background:var(--tc)}
.tab.drag{opacity:.55}
/* tab groups */
.gchip{flex:none;display:flex;align-items:center;gap:5px;height:22px;margin:0 3px 6px 5px;padding:0 9px;border-radius:11px;
  background:var(--gc);color:#fff;font-size:11.5px;font-weight:600;cursor:pointer;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gchip.col{opacity:.85}
.gchip em{font-style:normal;font-weight:500;opacity:.85}
.tab.g{background:color-mix(in srgb,var(--gc) 13%,transparent)}
.tab.g.on{background:color-mix(in srgb,var(--gc) 22%,var(--bg2))}
.tab.g::before{content:"";position:absolute;left:4px;right:4px;bottom:0;height:2px;background:var(--gc);border-radius:2px;opacity:.9}
.tab .fav{position:relative;width:16px;height:16px;flex:none;border-radius:3px;
  display:grid;place-items:center;overflow:visible}
.tab .fav img{width:16px;height:16px;border-radius:3px}
.tab .fav .rf{position:absolute;right:-5px;bottom:-4px;width:10px;height:10px;border-radius:5px;background:var(--bg);
  color:var(--accent);display:grid;place-items:center}
.tab .fav .rf svg{width:9px;height:9px;stroke-width:2.4}
.tab.sleep .fav,.tab.lazy .fav{opacity:.45}
.tab.sleep .ttl,.tab.lazy .ttl{opacity:.7}
.tab .ttl{flex:1;min-width:0;overflow:hidden;white-space:nowrap;
  text-overflow:ellipsis;font-size:12.5px}
.tab .x{flex:none;width:19px;height:19px;border-radius:5px;display:grid;
  place-items:center;opacity:0;transition:opacity .1s,background .1s}
.tab:hover .x,.tab.on .x{opacity:.75}
.tab .x:hover{background:var(--bg4);opacity:1}
.tab .x svg{width:11px;height:11px;stroke-width:2}
.spin{width:14px;height:14px;border:2px solid var(--bg4);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.snd{flex:none;width:18px;height:18px;opacity:.8;display:grid;place-items:center;border-radius:4px}
.snd:hover{background:var(--bg4);opacity:1}
.snd svg{width:15px;height:15px}
#strip .sbtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--dim);flex:none;margin-bottom:2px}
#strip .sbtn:hover{background:var(--bg3);color:var(--fg)}
#gap{flex:1 1 auto;min-width:24px;align-self:stretch}
#priv{display:none;align-items:center;gap:5px;color:#b98cff;font-size:11.5px;margin:0 6px 9px 0}
#priv svg{width:14px;height:14px}
body.private #priv{display:flex}
#vpnchip{display:none;align-items:center;gap:5px;color:var(--good);font-size:11.5px;margin:0 6px 9px 0;cursor:default}
#vpnchip svg{width:14px;height:14px}
#vpnchip.on{display:flex}

/* ---------------------------------------------------------------- toolbar */
#bar{display:flex;align-items:center;gap:3px;height:var(--bar);padding:0 8px;
  background:var(--bg2);border-bottom:1px solid var(--line)}
.btn{position:relative;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  color:var(--fg);flex:none;opacity:.88}
body.compact .btn{width:28px;height:28px}
.btn:hover{background:var(--bg3);opacity:1}
.btn[disabled]{opacity:.28}
.btn.act{color:var(--accent);opacity:1}
.btn.off{color:var(--dim2)}
.btn.hide{display:none}
.btn.vpn.on{color:var(--good);opacity:1}
.btn.vpn.connecting{color:var(--accent);opacity:1;animation:pulse 1.1s ease-in-out infinite}
.btn.vpn.error{color:var(--warn);opacity:1}
@keyframes pulse{50%{opacity:.35}}
.cnt{position:absolute;right:0;bottom:1px;min-width:15px;height:14px;padding:0 3px;border-radius:7px;
  background:var(--accent);color:#fff;font-size:9.5px;line-height:14px;text-align:center;font-weight:600;
  pointer-events:none;font-variant-numeric:tabular-nums}
.dot{position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:4px;background:var(--good);
  box-shadow:0 0 0 2px var(--bg2)}
#omni{flex:1;display:flex;align-items:center;gap:7px;height:calc(var(--bar) - 13px);margin:0 6px;
  padding:0 6px 0 10px;background:var(--bg3);border:1px solid transparent;
  border-radius:17px;min-width:0}
#omni.focus{background:var(--bg);border-color:var(--accent);
  box-shadow:0 0 0 3px var(--soft)}
#chip{flex:none;display:flex;align-items:center;gap:5px;color:var(--dim);font-size:11px;
  padding:3px 5px;margin-left:-5px;border-radius:9px}
#chip:hover{background:var(--bg4)}
#chip svg{width:13px;height:13px}
#chip.safe{color:var(--good)}
#chip.unsafe{color:var(--warn)}
#url{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);
  font:13.5px/1 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  user-select:text;-webkit-user-select:text}
#url::placeholder{color:var(--dim2)}
#omni .btn{width:26px;height:26px;border-radius:13px}
#omni .btn svg{width:15px;height:15px}
#zoomchip{display:none;flex:none;font-size:11px;color:var(--dim);padding:2px 7px;border-radius:9px;background:var(--bg4)}
#zoomchip.on{display:block}
#prog{height:2px;background:transparent}
#prog.on{background:linear-gradient(90deg,var(--accent),#ff7a46);
  animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{clip-path:inset(0 100% 0 0)}50%{clip-path:inset(0 0 0 0)}
  100%{clip-path:inset(0 0 0 100%)}}
#marks{display:none;align-items:center;gap:2px;height:32px;padding:0 8px;
  background:var(--bg2);border-bottom:1px solid var(--line);overflow:hidden}
#marks.on{display:flex}
.mk{display:flex;align-items:center;gap:6px;height:24px;padding:0 9px;
  border-radius:6px;max-width:190px;color:var(--fg);opacity:.9;font-size:12px;flex:none}
.mk:hover{background:var(--bg3);opacity:1}
.mk img{width:14px;height:14px;flex:none}
.mk span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ---------------------------------------------------------------- sidebar rail */
#rail{position:absolute;right:0;width:44px;background:var(--bg2);border-left:1px solid var(--line);
  display:none;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
#rail.on{display:flex}
#rail .btn{width:34px;height:34px}
#rail .btn img{width:18px;height:18px;border-radius:4px}
#rail .btn.act{background:var(--bg3)}
#rail .grow{flex:1}
#rail .lt{width:18px;height:18px;border-radius:5px;background:var(--bg4);color:var(--fg);font-size:11px;font-weight:600;
  display:grid;place-items:center}

/* ---------------------------------------------------------------- overlays */
#over{position:relative}
.panel{position:absolute;top:8px;background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
#drop{left:8px;right:8px;top:4px;padding:5px 0}
.sug{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;color:var(--fg)}
.sug:hover,.sug.sel{background:var(--bg3)}
.sug .si{width:16px;height:16px;flex:none;color:var(--dim);display:grid;place-items:center}
.sug .si img{width:16px;height:16px}
/* Title and detail sit next to each other. Letting the detail float to the far
   right put it 2000px from the title on a wide window, which is unreadable. */
.sug .st{flex:0 1 auto;min-width:0;max-width:58%;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.sug .st.big{font-size:15px;font-weight:600}
.sug:has(.st.wrap){height:auto;min-height:38px;padding:7px 12px}
.sug .st.wrap{white-space:normal;max-width:72%;font-size:13.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.sug .su{flex:1 1 auto;min-width:0;color:var(--dim);font-size:11.5px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.sug .su::before{content:"\2014\00a0";opacity:.5}
.sug b{color:var(--fg);font-weight:600}
#menu{right:8px;width:290px;padding:6px}
.mi{display:flex;align-items:center;gap:11px;height:33px;padding:0 10px;
  border-radius:7px;color:var(--fg);font-size:13px}
.mi:hover{background:var(--bg3)}
.mi .k{margin-left:auto;color:var(--dim2);font-size:11px}
.mi.tg .k{color:var(--dim)}
.mi.tg.on .k{color:var(--good)}
.sep{height:1px;background:var(--line);margin:5px 8px}
.hd{padding:7px 10px 4px;color:var(--dim2);font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase}
.mrow{display:flex;gap:4px;padding:2px 6px}
.mrow button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:8px;font-size:11px;color:var(--dim)}
.mrow button:hover{background:var(--bg3);color:var(--fg)}
.mrow button svg{width:18px;height:18px}
#find{right:8px;display:flex;align-items:center;gap:3px;padding:5px 5px 5px 12px;width:360px}
#find input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font-size:13px;
  user-select:text;-webkit-user-select:text}
#find .n{color:var(--dim);font-size:11.5px;min-width:60px;text-align:right;font-variant-numeric:tabular-nums}
#find .aa{font-size:11.5px;width:28px;opacity:.6}
#find .aa.act{opacity:1;color:var(--accent)}
#dl{right:8px;width:390px;padding:6px}
.dlr{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;border-radius:8px}
.dlr:hover{background:var(--bg3)}
.dlr .nm{flex:1;min-width:0}
.dlr .nm div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dlr .sub{color:var(--dim);font-size:11px}
.dlr .btn{width:28px;height:28px}
.dlr .btn svg{width:15px;height:15px}
.pbar{height:3px;background:var(--bg4);border-radius:2px;margin-top:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
#pal{left:50%;transform:translateX(-50%);width:620px;max-width:calc(100% - 24px);padding:6px;top:14px}
#pal input,.pin-in{width:100%;height:38px;background:var(--bg3);border:1px solid var(--line);
  border-radius:8px;padding:0 12px;color:var(--fg);font-size:14px;outline:0;
  user-select:text;-webkit-user-select:text;margin-bottom:5px}
#pal input:focus,.pin-in:focus{border-color:var(--accent)}
#ctx{width:230px;padding:5px;position:absolute}
#hover{width:280px;padding:10px 12px;pointer-events:none}
#hover .hth{display:block;width:calc(100% + 24px);margin:-10px -12px 8px;height:150px;object-fit:cover;object-position:top;border-radius:11px 11px 0 0}
.sumtxt{white-space:normal;line-height:1.5;padding:8px 14px;font-size:13px}
.sumtxt+.sumtxt{border-top:1px solid var(--line)}
.cite{padding:8px 14px}
.cite b{display:block;font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.cite div{white-space:normal;font-size:12.5px;line-height:1.45;user-select:text}
.cite button{margin-top:6px;padding:4px 10px;border-radius:6px;background:var(--bg3);color:var(--fg);font-size:12px}
#hover b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hover span{display:block;color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hover i{display:block;font-style:normal;color:var(--dim2);font-size:11px;margin-top:4px}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:4px;display:flex;align-items:center;gap:10px;
  background:var(--bg4);color:var(--fg);padding:6px 8px 6px 14px;border-radius:9px;
  box-shadow:var(--shadow);font-size:12.5px;max-width:70%;min-height:30px;white-space:nowrap}
#toast span{overflow:hidden;text-overflow:ellipsis}
#toast button{flex:none;padding:3px 10px;border-radius:6px;background:var(--accent);color:#fff;font-size:12px}
#toast button.x{background:none;color:var(--dim);padding:3px 6px}
.hide{display:none!important}
.pchip{height:26px;padding:0 10px 0 4px;border-radius:13px;display:flex;align-items:center;gap:6px;background:var(--bg3);color:var(--fg);font-size:12px;margin:0 2px;max-width:140px;
  transition:background .15s}
.pchip:hover{background:var(--bg4)}
.pchip i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:10.5px;color:#fff;flex:none}
.pchip span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* tab overview */
#tabov{left:50%;transform:translateX(-50%);top:8px;width:min(1100px,calc(100% - 24px));padding:14px}
#tabov input{width:100%;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);padding:0 12px;font:inherit;outline:0;margin-bottom:12px}
#tabov .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
#tabov .card{position:relative;border-radius:11px;background:var(--bg3);overflow:hidden;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s,box-shadow .15s}
#tabov .card:hover,#tabov .card.sel{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 26px rgba(0,0,0,.35)}
#tabov .card.on{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
#tabov .th{height:118px;background:var(--bg4) center top/cover no-repeat;display:grid;place-items:center}
#tabov .th img{width:32px;height:32px;border-radius:7px}
#tabov .ti{display:flex;align-items:center;gap:7px;padding:8px 10px;font-size:12.5px}
#tabov .ti img{width:14px;height:14px;border-radius:3px}
#tabov .ti span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#tabov .x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s}
#tabov .card:hover .x{opacity:1}
#tabov .x svg{width:12px;height:12px}
/* ---------------------------------------------------------------- motion
   Settings → Appearance → Animations: full, reduced (quick fades) or off.
   Panels are revealed with clip-path, which leaves their size alone, so the
   area the window keeps clickable for them is right from the first frame. */
@keyframes panelIn{from{opacity:0;clip-path:inset(0 0 calc(100% - 14px) 0 round 12px)}to{opacity:1;clip-path:inset(0 0 0 0 round 12px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes toastIn{from{opacity:0;clip-path:inset(0 0 100% 0 round 10px)}to{opacity:1;clip-path:inset(0 0 0 0 round 10px)}}
@keyframes tabIn{from{opacity:0;transform:translateY(8px) scale(.94)}}
@keyframes uline{from{transform:scaleX(0);opacity:0}}
@keyframes railIn{from{opacity:0;transform:translateX(10px)}}
@keyframes rowIn{from{opacity:0;transform:translateY(-4px)}}
#over>.panel{animation:panelIn .22s cubic-bezier(.2,.8,.2,1)}
#over>.panel.instant{animation:none}
#over>.panel .stagger{animation:rowIn .24s cubic-bezier(.2,.8,.2,1) both}
#toast.pop{animation:toastIn .28s cubic-bezier(.2,.8,.2,1)}
.tab.enter{animation:tabIn .28s cubic-bezier(.2,.8,.2,1) both}
.tab.juston::after{animation:uline .3s cubic-bezier(.2,.8,.2,1)}
#rail.opening .btn{animation:railIn .3s cubic-bezier(.2,.8,.2,1) both}
.btn,.tab .x,#toast button,.seg button,.pacts button{transition:background .12s,color .12s,opacity .12s,transform .12s}
.btn:active,.pacts button:active,.seg button:active{transform:scale(.9)}
.mi,.lrow,.sug{transition:background .12s}
:root[data-motion="reduced"] #over>.panel,:root[data-motion="reduced"] #toast.pop,:root[data-motion="reduced"] .tab.enter{animation:fadeIn .15s}

.big-panel{right:8px;width:350px;padding:0}
.ptop{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}

.sw{margin-left:auto;width:38px;height:22px;border-radius:11px;background:var(--bg4);position:relative;flex:none;transition:background .15s}

.pfoot{padding:9px 14px;border-top:1px solid var(--line);color:var(--dim2);font-size:11px;display:flex;gap:8px}

.msg{margin:0 14px 10px;padding:9px 11px;border-radius:8px;background:var(--bg3);color:var(--dim);font-size:12px;line-height:1.45}

.list{max-height:260px;overflow-y:auto;padding:4px 0}

.lrow:hover{background:var(--bg3)}
.lrow img,.lrow .ph{width:16px;height:16px;flex:none;border-radius:3px}

.lrow .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lrow .d{color:var(--dim2);font-size:11px;flex:none}

.vctl{display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px 10px}

.slog em{font-style:normal;color:var(--dim2);width:52px;flex:none}
.slog span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--fg)}

kbd{font:11px "Segoe UI",sans-serif;background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--fg)}
/* Never size anything in here as a percentage or in vh. This page's viewport

   flatten to its own padding. Panels are capped in real pixels by openOver(),
   using the window height the shell reports. */
.scroll{overflow-y:auto}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:5px}

.eqb{display:flex;align-items:flex-end;gap:2px;width:14px;height:14px}

.eqi{display:flex;align-items:flex-end;gap:2px;width:22px;height:20px;flex:none}

.ambs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

.ambs button:hover{color:var(--fg);transform:translateY(-1px)}
.ambs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn2{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);font:inherit;font-size:13px;cursor:pointer}

  animation:none!important;transition:opacity .45s,transform .45s}

    if (j && j.rates && j.rates.EUR) { fxRates = { ts:Date.now(), rates:j.rates, day:j.time_last_update_utc || "" }; save("fx", fxRates); if (overlay === "drop") suggest(); }

  const today = all[day] || (all[day] = {});

/* ---------------------------------------------------------------- snoozed tabs

  if (kind === "eve") { d.setHours(18, 0, 0, 0); if (d <= new Date()) d.setDate(d.getDate() + 1); return +d; }
  if (kind === "tom") { d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); return +d; }
  if (kind === "wkd") { const add = (6 - d.getDay() + 7) % 7 || 7; d.setDate(d.getDate() + add); d.setHours(10, 0, 0, 0); return +d; }
  if (kind === "week") { d.setDate(d.getDate() + 7); d.setHours(9, 0, 0, 0); return +d; }
  return 0;
}

    ["This weekend", "wkd"], ["Next week", "week"]], kind => {

/* ---------------------------------------------------------------- look-alike sites
   Warns before a page whose address imitates a well-known site: digits for
   letters (paypa1), one-letter typos (gooogle), letters from other alphabets
   that look Latin (pаypal with a Cyrillic а), or a famous name used as bait
   (paypal.com.account-verify.net, microsoft-login-secure.com). The real
   site on any ending (google.co.uk, amazon.de) is fine. */
const BRANDS = ["google", "youtube", "facebook", "instagram", "paypal", "apple", "microsoft", "amazon", "netflix", "roblox", "discord",
  "steamcommunity", "steampowered", "twitter", "tiktok", "reddit", "github", "linkedin", "outlook", "office", "dropbox", "chase",
  "bankofamerica", "wellsfargo", "coinbase", "binance", "ebay", "walmart", "spotify", "twitch", "whatsapp", "telegram", "yahoo",
  "icloud", "adobe", "epicgames", "playstation", "xbox", "crunchyroll", "pinterest", "snapchat", "docusign", "fedex", "usps",
  "americanexpress", "capitalone", "citibank", "hsbc", "barclays", "revolut", "venmo", "cashapp", "robinhood", "metamask", "blockchain",
  "kraken", "gmail", "hotmail", "wikipedia", "duckduckgo", "bing", "shopify", "stripe", "zoom", "slack", "notion", "openai", "chatgpt"];
// Real sites whose names are one letter from a brand.
const LOOK_OK = new Set(["gogle", "googl", "goggle", "googly", "youtu", "amzn", "redd"]);

const TYPO = BRANDS.filter(b => b.length >= 6 && !["office", "notion", "stripe", "kraken", "twitch"].includes(b));

function punyDecode(label) {

  const base = 36, tmin = 1, tmax = 26, skew = 38, damp = 700;

  const adapt = (delta, num, first) => {
    delta = first ? Math.floor(delta / damp) : delta >> 1; delta += Math.floor(delta / num);
    let k = 0; while (delta > ((base - tmin) * tmax) >> 1) { delta = Math.floor(delta / (base - tmin)); k += base; }
    return k + Math.floor((base - tmin + 1) * delta / (delta + skew));

  for (let p = d > 0 ? d + 1 : 0; p < label.length;) {
    const old = i;
    for (let w = 1, k = base; ; k += base) {
      const c = label.charCodeAt(p++);
      const digit = c - 48 < 10 ? c - 22 : c - 65 < 26 ? c - 65 : c - 97 < 26 ? c - 97 : base;
      if (digit >= base || p > label.length + 1) return null;
      i += digit * w;
      const t = k <= bias ? tmin : k >= bias + tmax ? tmax : k - bias;
      if (digit < t) break;
      w *= base - t;
    }
    bias = adapt(i - old, out.length + 1, old === 0);
    n += Math.floor(i / (out.length + 1)); i %= out.length + 1;
    out.splice(i++, 0, n);
  }
  return String.fromCodePoint(...out);

// Letters from other scripts that look like Latin ones.
const CONFUSE = { "а":"a", "е":"e", "о":"o", "р":"p", "с":"c", "у":"y", "х":"x", "і":"i", "ј":"j", "ԁ":"d", "ɡ":"g", "ո":"n", "ս":"u", "ѕ":"s",
  "ԛ":"q", "ԝ":"w", "һ":"h", "ӏ":"l", "к":"k", "м":"m", "т":"t", "в":"b", "ο":"o", "α":"a", "ν":"v", "ρ":"p", "τ":"t", "ι":"i", "κ":"k",
  "ε":"e", "μ":"u", "ı":"i", "ɑ":"a", "ʏ":"y", "ᴜ":"u", "ɩ":"i", "ⅼ":"l", "ﬁ":"fi", "à":"a", "á":"a", "â":"a", "ä":"a", "å":"a", "è":"e", "é":"e",
  "ê":"e", "ë":"e", "ì":"i", "í":"i", "î":"i", "ï":"i", "ò":"o", "ó":"o", "ô":"o", "ö":"o", "õ":"o", "ù":"u", "ú":"u", "û":"u", "ü":"u", "ç":"c", "ñ":"n", "ý":"y" };
const skeleton = s => [...s].map(c => CONFUSE[c] || c).join("");
const deDigit = s => s.replace(/rn/g, "m").replace(/vv/g, "w").replace(/0/g, "o").replace(/1/g, "l").replace(/3/g, "e").replace(/4/g, "a").replace(/5/g, "s").replace(/7/g, "t").replace(/8/g, "b");

const BAIT = /(^|-)(login|signin|secure|security|verify|verification|account|accounts|update|support|wallet|billing|recover|unlock|auth|confirm|service|help|gift|gifts|nitro|free|prize|giveaway|claim|reward|rewards|bonus)(-|$)/;
function lookalike(host) {

  if (!host || /^[\d.]+$/.test(host) || host.indexOf(".") < 0 || host === "browser.example") return null;
  const reg = regDomain(host), label = reg.split(".")[0];
  if (BRANDS.includes(label)) return null;                        // the real name, on any ending
  // letters from other alphabets
  const uni = host.split(".").map(l => l.startsWith("xn--") ? punyDecode(l.slice(4)) || l : l).join(".");
  if (uni !== host) {
    const sk = skeleton(regDomain(uni).split(".")[0]);
    if (BRANDS.includes(sk)) return { brand:sk, why:"its address uses letters from another alphabet that look like “" + sk + "”" };
  }

  const run = dir => { findQ = inp.value; if (active) send("find", active, findQ, dir, findCase ? 1 : 0);
                       if (!findQ) n.querySelector(".n").textContent = ""; };
  inp.oninput = () => run(0);

  aa.onclick = () => { findCase = !findCase; aa.classList.toggle("act", findCase); run(0); };
  prev.onclick = () => run(-1);
  next.onclick = () => run(1);
  shut.onclick = endFind;

/* ---------------------------------------------------------------- downloads */
function fmt(b) {
  b = +b || 0;
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(0) + " KB";
  if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB";
  return (b / 1073741824).toFixed(2) + " GB";
}
function dlLine(d) {
  return d.state === "done" ? fmt(d.total || d.got) + " · done"
       : d.state === "failed" ? "Failed"
       : d.state === "cancelled" ? "Cancelled"
       : d.state === "paused" ? "Paused · " + fmt(d.got) + (d.total ? " of " + fmt(d.total) : "")
       : fmt(d.got) + (d.total ? " of " + fmt(d.total) : "") + (d.rate ? " · " + fmt(d.rate) + "/s" : "") +
         (d.left > 0 ? " · " + fmtSecs(d.left) + " left" : "");
}
function dlPanel() {
  if (overlay === "dl") { closeOver(); return; }
  const m = el("div", "scroll");
  openOver("dl", m);
  fillDl();
}
function fillDl() {
  const m = $("#dl");
  if (!m) return;
  m.innerHTML = "";
  m.appendChild(el("div", "hd", "Downloads"));
  if (!dls.length) m.appendChild(el("div", "mi", '<span style="color:var(--dim)">Nothing downloaded yet</span>'));
  dls.slice(0, 12).forEach(d => {
    const r = el("div", "dlr");
    r.innerHTML = ico("dl");
    const nm = el("div", "nm");
    nm.appendChild(el("div")).textContent = d.name;
    nm.appendChild(el("div", "sub")).textContent = dlLine(d);
    if ((d.state === "progress" || d.state === "paused") && d.total) {
      const p = el("div", "pbar");
      p.appendChild(el("i")).style.width = Math.min(100, d.got / d.total * 100) + "%";
      nm.appendChild(p);
    }
    r.appendChild(nm);
    const btn = (icon, title, fn) => { const b = el("button", "btn", ico(icon)); b.title = title;
      b.onclick = e => { e.stopPropagation(); fn(); }; r.appendChild(b); };
    if (d.state === "progress") { btn("pause", "Pause", () => send("dl-pause", d.id)); btn("x", "Cancel", () => send("dl-cancel", d.id)); }
    else if (d.state === "paused") { btn("play", "Resume", () => send("dl-resume", d.id)); btn("x", "Cancel", () => send("dl-cancel", d.id)); }
    else if (d.state === "done") btn("folder", "Show in folder", () => send("show-file", d.path));
    else if ((d.state === "failed" || d.state === "cancelled") && d.uri) btn("rel", "Try again", () => send("dl-retry", d.id, d.uri));
    if (d.uri && /^https?:/.test(d.uri)) btn("copy", "Copy download link", () => { send("clip", d.uri); toast("Download link copied"); });
    r.onclick = () => { if (d.state === "done") send("open-file", d.path); };
    r.title = d.path || "";
    m.appendChild(r);
  });
  m.appendChild(el("div", "sep"));
  m.appendChild(row("folder", "Open downloads folder", "", () => send("dl-folder-open")));
  m.appendChild(row("list", "Show all downloads", "Ctrl+J", () => open1("history.html#downloads")));
  if (dls.length) m.appendChild(row("trash", "Clear list", "", () => { dls = dls.filter(d => d.state === "progress" || d.state === "paused"); saveNow("downloads"); }));
  requestAnimationFrame(relayout);
}

function palette(mode) {

      .map(c => ({ t:c.t, s:c.k ? "Command · " + c.k : "Command", go:bind ? () => setMyKey(bind, c.t) : c.fn, i:c.i }));

        .forEach(m => rows.push({ t:m.t || m.u, s:"Bookmark", go:() => go(m.u), i:"star", img:m.i || iconFor(m.u) }));
      hist.filter(h => ((h.t || "") + " " + h.u).toLowerCase().includes(q)).slice(0, 8)
        .forEach(h => rows.push({ t:h.t || h.u, s:hostOf(h.u), go:() => go(h.u), i:"clock", img:iconFor(h.u) }));

      d.appendChild(si);

    if (e.key === "ArrowDown") { psel = Math.min(psel + 1, Math.min(rows.length, cmdOnly ? 60 : 12) - 1); fill(); e.preventDefault();
      const s = list.querySelector(".sel"); if (s) s.scrollIntoView({ block:"nearest" }); }

    if (e.key === "Enter") { const r = rows[psel]; closeOver(); if (r) r.go(); }

function zoom(dir) {
  const t = T(active); if (!t) return;
  const steps = [.25,.33,.5,.67,.75,.8,.9,1,1.1,1.25,1.5,1.75,2,2.5,3,4,5];

         if (i < 0) i = steps.length - 1;
         if (dir < 0 && steps[i] > z - .01) i--;

    const th = art.th || (old && old.th), po = art.po || (old && old.po);

/* Group tabs by site: every site with two or more tabs gets its own group. */
function groupBySite() {
  const by = {};
  tabs.forEach(t => { if (!t.pinned && isWeb(t.url)) (by[hostOf(t.url)] = by[hostOf(t.url)] || []).push(t); });
  const cols = Object.keys(COLORS); let n = 0, made = 0;
  Object.keys(by).forEach(h => {
    if (by[h].length < 2) return;
    let gid = Object.keys(groups).find(g => groups[g].name === h);
    if (!gid) { gid = "g" + Date.now().toString(36) + (n++); groups[gid] = { name:h.slice(0, 30), color:cols[made % cols.length], collapsed:false }; made++; }
    by[h].forEach(t => { t.group = gid; });
  });
  // keep each group's tabs together
  const order = [];
  tabs.forEach(t => { if (order.includes(t)) return; if (t.group) tabs.filter(x => x.group === t.group).forEach(x => order.push(x)); else order.push(t); });
  tabs = order;
  saveGroups(); renderTabs(); saveSession();
  toast(made ? "Grouped " + made + " site" + (made === 1 ? "" : "s") : "No site has two tabs open");
}

/* Tab limit (Settings → Performance): above it, the tabs you used longest ago go to sleep. */
const sleepAsked = new Map();
function tabLimit() {
  const lim = +cfg.tabLimit || 0;
  if (!lim) return;
  const awake = tabs.filter(t => !t.sleep && !t.lazy && isWeb(t.url) && !(Date.now() - (sleepAsked.get(t.id) || 0) < 15000));
  if (awake.length <= lim) return;
  const cand = awake.filter(t => t.id !== active && !t.pinned && !t.audio && !(pair[0] && (t.id === pair[0] || t.id === pair[1]))).sort((a, b) => (a.seen || 0) - (b.seen || 0));
  const n = Math.min(cand.length, awake.length - lim);
  cand.slice(0, n).forEach(t => { sleepAsked.set(t.id, Date.now()); send("sleep-tab", t.id); });
  if (n) toast(n + " older tab" + (n === 1 ? "" : "s") + " put to sleep (tab limit " + lim + ")");
}

const MONTHS3 = ["Jan.", "Feb.", "Mar.", "Apr.", "May", "June", "July", "Aug.", "Sept.", "Oct.", "Nov.", "Dec."];
function citeFormats(r, now) {
  const title = String(r.title || "").trim(), site = String(r.site || "").trim(), url = String(r.url || "");
  const names = String(r.author || "").split(/,| and /).map(x => x.trim()).filter(Boolean).slice(0, 3);
  const d = r.date ? new Date(r.date) : null, ok = d && !isNaN(d);
  const last = n => { const p = n.split(/\s+/); return (p.length > 1 ? p[p.length - 1] + ", " + p.slice(0, -1).join(" ") : n).replace(/\.$/, ""); };
  const initials = n => { const p = n.split(/\s+/); return p.length > 1 ? p[p.length - 1] + ", " + p.slice(0, -1).map(x => x[0] + ".").join(" ") : n; };
  const acc = now.getDate() + " " + MONTHS3[now.getMonth()] + " " + now.getFullYear();
  const mla = (names.length ? last(names[0]) + (names.length > 1 ? ", et al" : "") + ". " : "") + "“" + title + ".” " + (site ? site + ", " : "") +
    (ok ? d.getDate() + " " + MONTHS3[d.getMonth()] + " " + d.getFullYear() + ", " : "") + url.replace(/^https?:\/\//, "") + ". Accessed " + acc + ".";
  const apa = (names.length ? names.map(initials).join(", ") + " " : site ? site + ". " : "") + "(" + (ok ? d.getFullYear() + ", " + d.toLocaleDateString("en-US", { month:"long", day:"numeric" }) : "n.d.") + "). " +
    title + ". " + (names.length && site ? site + ". " : "") + url;
  const chi = (names.length ? last(names[0]) + (names.length > 1 ? " et al" : "") + ". " : "") + "“" + title + ".” " + (site ? site + ". " : "") +
    (ok ? d.toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" }) + ". " : "Accessed " + now.toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" }) + ". ") + url + ".";
  return [["MLA", mla], ["APA", apa], ["Chicago", chi]];
}

/* Watch history: every longer video you played, newest first. */
function watchHistory(url, title, time, dur) {

/* Tab overview: every tab as a picture. A tab is pictured while it is on
   screen (after it loads, when you switch to it); others show their icon. */
const thumbT = {};
function thumbSoon(id, ms) { clearTimeout(thumbT[id]); thumbT[id] = setTimeout(() => { const t = T(id); if (t && isWeb(t.url) && (id === active || id === pair[0] || id === pair[1])) send("tab-thumb", id); }, ms); }
function gotThumb(id, url) {
  const t = T(id);
  if (!t || !/^data:image\/jpeg;base64,/.test(url || "")) return;
  const im = new Image();
  im.onload = () => {
    const c = document.createElement("canvas"), w = 400; c.width = w; c.height = Math.round(w * Math.min(im.height / im.width, .75));
    c.getContext("2d").drawImage(im, 0, 0, im.width, im.width * c.height / w, 0, 0, c.width, c.height);
    t.thumb = c.toDataURL("image/jpeg", .72);
    if (overlay === "tabov") fillOverview();
  };
  im.src = url;
}
let ovSel = 0;
function tabOverview() {
  if (overlay === "tabov") { closeOver(); return; }
  const p = el("div");
  p.innerHTML = '<input placeholder="Filter tabs" spellcheck="false"><div class="grid"></div>';
  openOver("tabov", p);
  ovSel = Math.max(0, tabs.findIndex(t => t.id === active));
  const inp = p.querySelector("input");
  inp.oninput = () => { ovSel = 0; fillOverview(); };
  inp.onkeydown = e => {
    const cards = [...p.querySelectorAll(".card")], cols = Math.max(1, Math.round(p.querySelector(".grid").clientWidth / 212));
    const mv = { ArrowRight:1, ArrowLeft:-1, ArrowDown:cols, ArrowUp:-cols }[e.key];
    if (mv) { e.preventDefault(); ovSel = Math.max(0, Math.min(cards.length - 1, ovSel + mv)); fillOverview(); }
    if (e.key === "Enter" && cards[ovSel]) cards[ovSel].click();
    if (e.key === "Escape") closeOver();
    if (e.key === "Delete" && cards[ovSel] && !inp.value) { closeTab(+cards[ovSel].dataset.id); setTimeout(fillOverview, 50); }
  };
  fillOverview();
  thumbSoon(active, 10);
  setTimeout(() => inp.focus({ preventScroll:true }), 0);
}
function fillOverview() {

  const list = tabs.filter(t => !q || ((t.title || "") + " " + t.url).toLowerCase().includes(q));
  g.innerHTML = "";
  list.forEach((t, i) => {
    const c = el("div", "card" + (t.id === active ? " on" : "") + (i === ovSel ? " sel" : ""));
    c.dataset.id = t.id;
    c.innerHTML = '<div class="th"></div><div class="ti"><img alt=""><span></span></div><div class="x" title="Close">' + ico("x") + '</div>';
    if (t.thumb) c.querySelector(".th").style.backgroundImage = 'url("' + t.thumb + '")';
    else { const im = new Image(); im.src = t.icon || ""; if (t.icon) c.querySelector(".th").appendChild(im); }
    c.querySelector(".ti img").src = t.icon || ""; if (!t.icon) c.querySelector(".ti img").remove();
    c.querySelector("span").textContent = t.title || hostOf(t.url) || "New tab";
    if (!p.dataset.filled) { c.style.animationDelay = Math.min(i * 20, 300) + "ms"; c.classList.add("stagger"); }
    c.onclick = e => { if (e.target.closest(".x")) { closeTab(t.id); setTimeout(fillOverview, 50); return; } closeOver(); select(t.id); };
    g.appendChild(c);
  });
  if (!list.length) g.innerHTML = '<div style="color:var(--dim);padding:20px">No tab matches.</div>';

  requestAnimationFrame(relayout);
}

/* Pause when you switch away (Settings → Video), play again when you come back. */
const pausedBySwitch = new Set();
function switchedTab(from, to) {
  if (from && from !== to) thumbSoon(from, 0);
  thumbSoon(to, 700);
  if (!cfg.pauseOnSwitch) return;
  const a = T(from);
  if (a && from !== to && a.audio && !a.muted && !(pair[0] && (from === pair[0] || from === pair[1]))) { send("media", from, "pause", ""); pausedBySwitch.add(from); }
  if (pausedBySwitch.has(to)) { pausedBySwitch.delete(to); send("media", to, "play", ""); }
}

function saveReadPos(id, p) {
  const t = T(id); if (!t || !isWeb(t.url) || !(p >= 0 && p <= 1)) return;
  const all = load("readpos", {}), k = t.url.split("#")[0];
  if (p > .97 || p < .03) delete all[k]; else all[k] = { p, ts:Date.now() };
  const keys = Object.keys(all);
  if (keys.length > 300) keys.sort((a, b) => all[a].ts - all[b].ts).slice(0, keys.length - 300).forEach(x => delete all[x]);
  save("readpos", all);
}
function saveDraft(id, r) {

  const all = load("drafts", {}), k = t.url.split("#")[0];
  if (r.clear) { delete all[k]; save("drafts", all); return; }

/* Light by day, dark after sunset: where you are comes from the weather

  const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
