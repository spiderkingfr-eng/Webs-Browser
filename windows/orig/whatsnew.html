     find it. The count at the top is computed, not typed. -->
<style>
:root{--bg:#16131a;--bg2:#1e1a24;--bg3:#272230;--line:#322c3c;--fg:#f3eff1;--dim:#9a91a3;--dim2:#6f6779;--accent:#e8342a}
:root[data-theme="light"]{--bg:#efebe3;--bg2:#f9f6ef;--bg3:#e6e0d6;--line:#d9d2c6;--fg:#1d1a20;--dim:#6b6560;--dim2:#928b83}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:40px 24px 80px}
h1{font-size:30px;font-weight:600;letter-spacing:-.01em}
h1 b{color:var(--accent)}
.sub{color:var(--dim);margin:6px 0 22px;max-width:640px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}
.bar input{flex:1;min-width:200px;height:36px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;color:var(--fg);padding:0 12px;font:inherit;outline:0}
.bar input:focus{border-color:var(--accent)}
.bar button{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--bg2);color:var(--dim);font:12.5px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;cursor:pointer}
.bar button.on{border-color:var(--accent);color:var(--fg)}
h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);margin:26px 0 10px;display:flex;gap:8px}
h2 span{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.f{display:flex;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.f .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--bg3);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
.f b{display:block;font-weight:600;font-size:13.5px}
.f span{display:block;color:var(--dim);font-size:12.5px}
.f i{display:block;font-style:normal;color:var(--dim2);font-size:11.5px;margin-top:3px}
.hide{display:none!important}
/* motion */
.f{animation:up .45s cubic-bezier(.2,.8,.2,1) both;transition:transform .2s,border-color .15s,box-shadow .2s}
.f:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 10px 24px rgba(0,0,0,.22)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes fadeIn{from{opacity:0}}
:root[data-motion="reduced"] *{animation-name:fadeIn!important;animation-duration:.15s!important;animation-delay:0s!important}
:root[data-motion="off"] *,:root[data-motion="off"] *::before,:root[data-motion="off"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation-name:fadeIn!important;animation-duration:.15s!important;animation-delay:0s!important}}
</style>
<div class="wrap">
  <h1><b id="count">100</b> new features</h1>

  <div class="bar"><input id="q" placeholder="Search features" spellcheck="false"><span id="cats"></span></div>

</div>

  const K = ["bg", "bg2", "bg3", "bg4", "line", "fg", "dim", "dim2"];
  function apply() {
    let s = {}; try { s = JSON.parse(localStorage.getItem("wsb.settings") || "{}"); } catch (e) {}
    const light = s.theme === "light" || document.documentElement.dataset.theme === "light";
    const pk = !light && (s.pack === "custom" && Array.isArray(s.customTheme) && s.customTheme.length === 8 && s.customTheme.every(c => /^#[0-9a-f]{6}$/i.test(c)) ? s.customTheme : P[s.pack]), r = document.documentElement.style;
    K.forEach((k, i) => { if (pk) r.setProperty("--" + k, pk[i]); else r.removeProperty("--" + k); });
  }
  apply();
  addEventListener("storage", e => { if (e.key === "wsb.settings") setTimeout(apply, 0); });
  document.addEventListener("wsb-pack", apply);
})();

let n = 0;
const out = document.getElementById("out"), cats = document.getElementById("cats");
Object.keys(F).forEach(cat => {
  const h = document.createElement("h2");
  h.innerHTML = "<span></span><em></em>";
  h.querySelector("span").textContent = F[cat].length;
  h.querySelector("em").textContent = cat;
  h.querySelector("em").style.fontStyle = "normal";
  const g = document.createElement("div");
  g.className = "grid";
  F[cat].forEach(([t, d, w]) => {
    const c = document.createElement("div");
    c.className = "f";
    c.innerHTML = '<div class="n"></div><div><b></b><span></span><i></i></div>';
    c.querySelector(".n").textContent = ++n;
    c.querySelector("b").textContent = t;
    c.querySelector("span").textContent = d;
    c.querySelector("i").textContent = w;
    if (n <= 40) c.style.animationDelay = n * 25 + "ms";   // the first screenful arrives one after another
    g.appendChild(c);
  });
  out.appendChild(h); out.appendChild(g);
});
document.getElementById("count").textContent = n;
document.getElementById("q").oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".f").forEach(c => c.classList.toggle("hide", !!q && !c.textContent.toLowerCase().includes(q)));
  document.querySelectorAll(".grid").forEach(g => { const any = [...g.children].some(c => !c.classList.contains("hide"));
    g.classList.toggle("hide", !any); g.previousElementSibling.classList.toggle("hide", !any); });
};
