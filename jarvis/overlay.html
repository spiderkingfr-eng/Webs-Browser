<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jarvis</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="bubble" class="idle">
  <div class="drag"></div>
  <header>
    <span class="dot" id="dot"></span>
    <b id="who">Jarvis</b>
    <span class="left" id="left"></span>
    <button class="stop" id="stop" title="Stop talking" hidden>■ Stop</button>
    <button class="x" id="voice" title="Voice on - click to just read the answers">🔊</button>
    <button class="x" id="mic" title="Ask by voice">🎙️</button>
    <button class="x" id="close" title="Hide">✕</button>
  </header>
  <div class="q" id="q" hidden></div>
  <div class="warn" id="warn" hidden></div>
  <div class="status" id="status" hidden></div>
  <div class="a" id="a"></div>
  <div class="tools">
    <button class="tool" id="copy" hidden title="Copy the answer">📋 Copy</button>
    <button class="tool" id="again" hidden title="Read the answer out again">🔁 Read again</button>
    <button class="tool" id="newchat" hidden title="It remembers this conversation so you can ask follow-ups. Click to start fresh.">✨ New chat</button>
  </div>
  <form id="ask">
    <input id="in" type="text" placeholder="Ask anything…" autocomplete="off" spellcheck="false">
    <button type="submit" title="Send">➤</button>
  </form>
</div>
<script src="overlay.js"></script>
</body>
</html>
